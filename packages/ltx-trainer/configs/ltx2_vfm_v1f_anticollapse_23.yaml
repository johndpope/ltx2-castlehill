# =============================================================================
# VFM v1f — ANTI-COLLAPSE FIX + BENCHMARK AT STEP 1000
# =============================================================================
# Previous run (xfyzczcp) collapsed: adapter outputs identical mu/kappa for all
# prompts despite obs_loss_weight=12.5. Root cause: regularization losses
# (KL, kappa_pull, magnitude_reg) push toward fixed targets faster than
# obs_loss can pull toward text-conditioned outputs.
#
# Fix strategy:
#   1. DISABLE kappa_pull and magnitude_reg during warmup (let adapter explore)
#   2. Lower kl_weight further (0.0001)
#   3. Increase obs_loss_weight to 25.0
#   4. Add direct mu reconstruction loss (mu should predict x0 direction)
#   5. Checkpoint at 500-step intervals for benchmark at step 1000
#
# Usage:
#   nohup uv run python scripts/train.py configs/ltx2_vfm_v1f_anticollapse_23.yaml \
#     --disable-progress-bars > /tmp/vfm_v1f_anticollapse.log 2>&1 &
# =============================================================================

model:
  model_path: "/media/2TB/ltx-models/ltx2.3/ltx-2.3-22b-distilled.safetensors"
  text_encoder_path: "/media/2TB/ltx-models/gemma"
  training_mode: "lora"
  # Resume from v1f step 8000 checkpoint
  load_checkpoint: "/media/2TB/omnitransfer/output/vfm_v1f_pertoken_5k_23/checkpoints/lora_weights_step_08000.safetensors"
  load_noise_adapter: "/media/2TB/omnitransfer/output/vfm_v1f_pertoken_5k_23/checkpoints/noise_adapter_step_08000.safetensors"

lora:
  rank: 4
  alpha: 4
  dropout: 0.0
  target_modules:
    - "to_q"
    - "to_v"

training_strategy:
  name: "vfm_v1f"

  # === Spherical Cauchy (v1f) ===
  spherical_noise: true
  kappa_min: 1.0             # was 0.1 — higher floor = mu direction matters more
  kappa_max: 10.0           # was 5.0 — allow more range
  use_slerp_interp: false
  magnitude_reg_weight: 0.0  # DISABLED — was 0.1, fights obs_loss
  target_magnitude: 1.0
  kappa_entropy_weight: 0.0  # DISABLED — was 0.01, fights obs_loss
  kappa_target: 2.0
  kappa_pull_weight: 0.0     # DISABLED — was 0.1, forces kappa to fixed value

  # === Per-token sigma (x0-conditioned SigmaHead) ===
  per_token_sigma: true
  sigma_min: 0.3
  sigma_max: 1.0
  sigma_head_hidden_dim: 256
  sigma_entropy_weight: 0.0  # DISABLED during anti-collapse
  sigma_mean_target: 0.7
  sigma_mean_pull_weight: 0.0  # DISABLED — let sigma find its own level

  # === No distillation ===
  distill_mode: "none"

  # === v1b Adapter ===
  adapter_variant: "transformer"
  adapter_hidden_dim: 512
  adapter_num_heads: 8
  adapter_num_layers: 4
  adapter_pos_dim: 256

  # === VFM Loss — ANTI-COLLAPSE ===
  tau: 1.0
  obs_noise_level: 0.2
  alpha: 1.0                   # was 0.8 — ALWAYS use adapter (no unconditional fallback)
  kl_weight: 0.0001            # was 0.001 — 10x lower to reduce collapse pressure
  kl_free_bits: 0.1            # was 0.05 — more free bits
  obs_loss_weight: 25.0        # was 12.5 — doubled, this is the signal that forces text conditioning
  adaptive_loss: true
  ema_decay: 0.999
  first_frame_conditioning_p: 0.0  # DISABLED — causes sigma=0 flicker on frame 0

  # === Diversity — STRONGER ===
  diversity_weight: 0.2         # was 0.1 — stronger push for diverse adapter outputs
  temporal_diversity_weight: 0.2
  spatial_diversity_weight: 0.1
  diversity_warmup_steps: 0     # was 200 — diversity from step 0

  # === ANTI-COLLAPSE: mu→x₀ alignment (Grok recommendation #1) ===
  mu_align_weight: 5.0          # Direct cosine alignment: adapter mu must point toward x₀
  mu_align_warmup_steps: 0      # No warmup — align from step 0

  # === ANTI-COLLAPSE: freeze DiT LoRA (Grok recommendation #2) ===
  freeze_dit_steps: 0           # Disabled — resuming from step 8000 (past freeze window)

  inverse_problem_weights:
    i2v: 1.0

  with_audio: false

  log_reconstructions: true
  reconstruction_log_interval: 100  # was 200 — more frequent logging to catch collapse early
  log_vfm_metrics: true

optimization:
  learning_rate: 1.0e-4         # DiT LoRA LR (lower — don't let DiT compensate)
  adapter_learning_rate: 1.0e-3  # Adapter LR (10x higher — escape collapse fast)
  steps: 5000
  batch_size: 1
  gradient_accumulation_steps: 4  # effective batch=4
  max_grad_norm: 1.0
  optimizer_type: "adamw"
  scheduler_type: "cosine"
  scheduler_params:
    eta_min: 1.0e-5
  weight_decay: 0.01
  warmup_steps: 200
  enable_gradient_checkpointing: true

acceleration:
  mixed_precision_mode: "bf16"
  quantization: "int8-quanto"
  load_text_encoder_in_8bit: true

hardware:
  devices:
    text_encoder: "cuda:1"
    vae_encoder: "cuda:1"
    vae_decoder: "cuda:1"
    transformer: "cuda:0"
    audio_vae: "cuda:0"
    vocoder: "cuda:0"

data:
  preprocessed_data_root: "/media/12TB/ddit_ditto_data_23"
  num_dataloader_workers: 2
  use_cached_final_embeddings: true
  final_embeddings_dir: "conditions_final"

checkpoints:
  interval: 500                 # benchmark at step 1000 = 2nd checkpoint
  keep_last_n: 10

flow_matching:
  timestep_sampling_mode: "shifted_logit_normal"
  timestep_sampling_params: {}

hub:
  push_to_hub: false
  hub_model_id: null

wandb:
  enabled: true
  project: "vfm-v1f"
  entity: null
  tags: ["vfm-v1f", "anti-collapse", "obs25", "no-reg-warmup", "alpha1.0", "ltx-2.3-22b"]
  log_validation_videos: false

seed: 42
output_dir: "/media/2TB/omnitransfer/output/vfm_v1f_anticollapse_23"
