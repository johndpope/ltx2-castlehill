# =============================================================================
# VFM v3b — STRIPPED config (replicates hvrpf0ed success on 5K)
# =============================================================================
# Grok recommendation: the overfit run that converged (0.04 in 2000 steps)
# used ONLY data_loss + self_eval(50%) + KL. Nothing else.
# Stop adding losses. Simplicity converges.
#
# Changes from previous failing run:
#   - obs_loss=0 (was 2, was 25 before that)
#   - perceptual=0 (was 0.5)
#   - mu_align=0, diversity=0
#   - alpha=0.5 (was 1.0 — mix adapter + gaussian for stability)
#   - self_eval_prob=0.5 (was 0.75/1.0)
#   - LoRA rank 64 (was 32 — more capacity for 5K diversity)
#   - LR 2e-4 (was 5e-4 — smoother from converged checkpoint)
#   - warmup 500 (was 50)
# =============================================================================

model:
  model_path: "/media/2TB/ltx-models/ltx2.3/ltx-2.3-22b-distilled.safetensors"
  text_encoder_path: "/media/2TB/ltx-models/gemma"
  training_mode: "lora"
  # Fresh start — previous LoRA was trained with alpha=0.5 (garbage at inference)
  load_checkpoint: null
  load_noise_adapter: null

lora:
  rank: 32
  alpha: 32
  dropout: 0.0
  target_modules:
    - "to_q"
    - "to_k"
    - "to_v"
    - "to_out.0"

training_strategy:
  name: "vfm_v3b"

  # === ONLY these three losses (hvrpf0ed recipe) ===
  spherical_noise: true
  kl_weight: 0.001
  kl_free_bits: 0.25
  self_eval_weight: 1.0
  self_eval_cfg_scale: 5.0
  self_eval_s_range: [0.2, 0.4]
  energy_preserving_norm: true
  self_eval_prob: 0.5

  # === EVERYTHING ELSE OFF ===
  obs_loss_weight: 0.0
  obs_noise_level: 0.2
  latent_perceptual_weight: 0.0
  mu_align_weight: 0.0
  mu_align_warmup_steps: 0
  diversity_weight: 0.0
  temporal_diversity_weight: 0.0
  spatial_diversity_weight: 0.0
  diversity_warmup_steps: 0
  recon_weight: 0.0
  flow_match_weight: 0.0
  gt_weight: 0.0

  # === Alpha 1.0 (ALWAYS adapter noise — LoRA must learn adapter→clean mapping) ===
  # alpha=0.5 produced good training loss but garbage inference because LoRA
  # learned to denoise Gaussian noise 50% of the time. At inference we only
  # feed adapter noise → LoRA doesn't know what to do with it.
  alpha: 1.0

  # Adapter
  adapter_variant: "transformer"
  adapter_hidden_dim: 512
  adapter_num_heads: 8
  adapter_num_layers: 4
  adapter_pos_dim: 256

  # Per-token sigma
  per_token_sigma: true
  sigma_min: 0.05
  sigma_max: 0.95
  sigma_head_hidden_dim: 256

  # VFM base
  tau: 1.0
  adaptive_loss: true
  ema_decay: 0.999
  first_frame_conditioning_p: 0.1
  distill_mode: "none"

  inverse_problem_weights:
    i2v: 0.4
    t2v: 0.6

  with_audio: false

  log_reconstructions: true
  reconstruction_log_interval: 500
  log_vfm_metrics: true

optimization:
  learning_rate: 2.0e-4
  adapter_learning_rate: 5.0e-4
  steps: 20000
  batch_size: 2
  gradient_accumulation_steps: 2
  max_grad_norm: 1.0
  optimizer_type: "adamw"
  scheduler_type: "cosine"
  scheduler_params:
    eta_min: 1.0e-5
  weight_decay: 0.01
  warmup_steps: 500
  enable_gradient_checkpointing: true

acceleration:
  mixed_precision_mode: "bf16"
  quantization: "int8-quanto"
  load_text_encoder_in_8bit: true

hardware:
  devices:
    transformer: "cuda:0"
    vae_decoder: "cuda:1"
    vae_encoder: "cuda:1"

data:
  preprocessed_data_root: "/media/12TB/ddit_ditto_data_23"
  num_dataloader_workers: 2
  use_cached_final_embeddings: true
  final_embeddings_dir: "conditions_final"

checkpoints:
  interval: 1000
  keep_last_n: 5

flow_matching:
  timestep_sampling_mode: "shifted_logit_normal"
  timestep_sampling_params: {}

hub:
  push_to_hub: false
  hub_model_id: null

wandb:
  enabled: true
  project: "vfm-v3b"
  entity: null
  tags: ["self-e", "vfm-v3b", "5k", "stripped", "rank64", "grok-tuned"]
  log_validation_videos: false

seed: 42
output_dir: "/media/2TB/omnitransfer/output/vfm_v3b_5k_stripped"
